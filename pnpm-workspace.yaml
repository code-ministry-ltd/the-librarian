packages:
  - "packages/*"
  - "apps/*"
  - "clients/*"
  - "integrations/pi"

catalog:
  typescript: ^5.7.2
  vite: ^5.4.21
  vitest: ^2.1.8

# pnpm 11 reads dependency-resolution settings here; keep these selectors in
# sync with package.json#pnpm.overrides while Docker and CI remain on pnpm 9.
overrides:
  "js-yaml@>=3.0.0 <3.15.1": "3.15.1"
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  "nanoid@>=3.0.0 <3.3.17": "3.3.17"
  "nanoid@>=5.0.0 <5.1.16": "5.1.16"
  "postcss@<=8.5.25": "8.5.26"
  "sharp@<0.35.0": "0.35.3"
  "svgo@>=4.0.0 <4.0.2": "4.0.2"
  "tar@<=7.5.21": "7.5.22"
  "form-data@>=4.0.0 <4.0.6": "4.0.6"
  "undici@>=8.0.0 <8.9.0": "8.9.0"
  "ws@>=8.0.0 <8.21.3": "8.21.3"
  "@babel/core@<7.29.7": "7.29.7"
  "protobufjs@<7.6.5": "7.6.5"
